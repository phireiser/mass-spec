[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mass-spec-modeling"
version = "0.0.1"
description = "Mass spec modeling utilities and ML pipeline"
readme = "README.md"
requires-python = ">=3.09"

dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "networkx",
  "tqdm",
  "requests",
  "typing-extensions",
  "pytz",

  "matplotlib",
  "torch",
  "torch_geometric",
  "torch-scatter",
  "torch-sparse",
  "torch-cluster",
  "torchvision",
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["mass_spec_modeling*"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
addopts = "-q --strict-markers --maxfail=1"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: marks tests that hit external systems or run slowly",
]
