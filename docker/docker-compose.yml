version: '3.8' # Docker Compose version

# Named volumes for runtime mounting
volumes:

services:
  # Data generation service (CPU-focused)
  data-gen:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: mol-spectro:latest
    container_name: mol-spectro-data-gen
    volumes:
      - ../data:/app/data
      - ../outputs:/app/outputs
    environment:
      - PYTHONPATH=/app:${PYTHONPATH}
    command: data-gen
    stdin_open: true
    tty: true

  # Model training service (GPU-enabled)
  training:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: mol-spectro:latest
    container_name: mol-spectro-training
    runtime: nvidia
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - EPOCHS_FWD=10000
      - EPOCHS_BWD=10000
      - PYTHONPATH=/app:${PYTHONPATH}
    volumes:
      - ../data:/app/data
      - ../outputs:/app/outputs
    command: train
    stdin_open: true
    tty: true

  # Hyperparameter optimization service (GPU-enabled)
  optimize:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: mol-spectro:latest
    container_name: mol-spectro-optimize
    runtime: nvidia
    environment:
      - CUDA_VISIBLE_DEVICES=1
      - EPOCHS_FWD=10000
      - EPOCHS_BWD=10000
      - PYTHONPATH=/app:${PYTHONPATH}
    volumes:
      - ../data:/app/data
      - ../outputs:/app/outputs
    command: optimize
    stdin_open: true
    tty: true

  # Analysis & plotting service (CPU-focused)
  analysis:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: mol-spectro:latest
    container_name: mol-spectro-analysis
    volumes:
      - ../outputs:/app/outputs
      - ../data:/app/data
    environment:
      - PYTHONPATH=/app:${PYTHONPATH}
    command: analyze
    stdin_open: true
    tty: true

  # Interactive development shell
  shell:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: mol-spectro:latest
    container_name: mol-spectro-shell
    runtime: nvidia
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONPATH=/app:${PYTHONPATH}
    volumes:
      - ./:/app
      - ../data:/app/data
      - ../outputs:/app/outputs
    command: shell
    stdin_open: true
    tty: true
