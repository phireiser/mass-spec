name: mol-thesis
channels:
  - pytorch
  - conda-forge
dependencies:
  # Core Python
  - python>=3.8,<3.12
  
  # PyTorch (official conda distribution recommended)
  - pytorch::pytorch>=2.0.0
  - pytorch::pytorch-cuda=12.1  # or pytorch::pytorch-cpu for CPU-only
  - pytorch::pytorch-geometric>=2.3.0
  
  # Scientific computing
  - numpy>=1.21.0
  - scipy>=1.7.0
  - pandas>=1.3.0
  - matplotlib>=3.4.0
  - networkx>=2.6.0
  
  # Utilities
  - pyyaml>=5.4.0
  - requests>=2.26.0
  
  # Optional: FAISS for fast retrieval (uncomment as needed)
  # - pytorch::faiss-cpu>=1.7.0
  # - pytorch::faiss-gpu>=1.7.0
  
  # Development tools (optional)
  - pip>=21.0
  - pytest>=7.0.0
  - pytest-cov>=3.0.0
  - black>=22.0.0
  - flake8>=3.9.0

# Pre-install note:
# MOD library must be installed separately via system package manager or from source
# See: https://mod.imada.sdu.dk/
